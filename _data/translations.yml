    home_intro: |
      欢迎访问我的个人主页！我现任[广东工业大学](https://www.gdut.edu.cn)[数学与统计学院](https://math.gdut.edu.cn)副教授，主要研究 Kohn–Sham 方程的数值方法，以及量子色动力学中的复朗之万方法。

      在 Kohn–Sham 方程的数值求解方面，我关注自适应方法与高阶离散方法的设计、离散问题的免正交化算法，以及通过构造合适的初值来减少非线性求解中的发散问题。

      对于量子色动力学中的复朗之万方法，我关注稳定化技术，希望抑制数值发散，并使计算收敛到正确的结果。
    biography: >-
      况阳现任广东工业大学数学与统计学院副教授，主要研究密度泛函理论的数值方法，以及量子色动力学中的复朗之万方法。此前在新加坡国立大学数学系从事博士后研究（Research Fellow），合作者为蔡振宁教授；在澳门大学获得博士学位，导师为胡光辉教授。
