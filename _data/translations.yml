    home_intro: |
      Welcome to my personal homepage! I am currently working as an associate professor in the [School of Mathematics and Statistics](https://math.gdut.edu.cn) of [Guangdong University of Technology](https://www.gdut.edu.cn). My focus is on numerical methods for the Kohn--Sham equation and complex Langevin methods in quantum chromodynamics.

      In the area of the Kohn-Sham equation, I am working on several aspects, including the design of adaptive and high-order methods for discretization, the development of orthogonality-free methods for the discretized problem, and the generation of quality initial guesses to reduce divergence issues related to nonlinearity.

      Regarding complex Langevin methods in quantum chromodynamics, I have shown interest in the development of stabilization techniques. These approaches aim to prevent divergence and converge to the correct results obtained through these methods.
    biography: >-
      Yang Kuang is an associate professor in the School of Mathematics and Statistics at Guangdong University of Technology focusing on numerical methods for density functional theory and complex Langevin method in quantum chromodynamics. Prior to this, he was a Research Fellow in the Department of Mathematics working with Prof. Zhenning Cai at the National University of Singapore. He finished his PhD at the University of Macau under the supervision of Prof. Guanghui Hu.
